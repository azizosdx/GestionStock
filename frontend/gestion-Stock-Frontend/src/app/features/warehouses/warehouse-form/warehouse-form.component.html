<div class="form-container">
  <h2>{{ isEditMode ? 'Modifier Entrepôt' : 'Ajouter Nouvel Entrepôt' }}</h2>
  
<form [formGroup]="warehouseForm" (ngSubmit)="onSubmit()" class="warehouse-form" *ngIf="warehouseForm">
    <div class="form-group">
      <label for="nom">Nom de l'Entrepôt</label>
      <input id="nom" type="text" formControlName="nom" class="form-control">
      <div class="error-message" *ngIf="warehouseForm.get('nom')?.touched && warehouseForm.get('nom')?.invalid">
        Le nom est requis
      </div>
    </div>

    <div class="form-group">
      <label for="adresse">Adresse</label>
      <input id="adresse" type="text" formControlName="adresse" class="form-control">
      <div class="error-message" *ngIf="warehouseForm.get('adresse')?.touched && warehouseForm.get('adresse')?.invalid">
        L'adresse est requise
      </div>
    </div>

    <div class="form-group">
      <label for="capacite">Capacité</label>
      <input id="capacite" type="number" formControlName="capacite" class="form-control">
      <div class="error-message" *ngIf="warehouseForm.get('capacite')?.touched && warehouseForm.get('capacite')?.invalid">
        La capacité est requise et doit être positive
      </div>
    </div>


    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/warehouses">Annuler</button>
      <button type="submit" class="btn btn-primary" [disabled]="warehouseForm.invalid">
        {{ isEditMode ? 'Modifier' : 'Créer' }} Entrepôt
      </button>
    </div>
  </form>
</div>
