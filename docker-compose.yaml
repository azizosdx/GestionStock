version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: gestionstock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestionstock
      MYSQL_USER: aziz
      MYSQL_PASSWORD: aziz
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network

  backend-app:
    image: backend-app
    container_name: gestionstock-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
    networks:
      - db_network

  web-app:
    image: web-app
    container_name: gestionstock-webapp
    build:
      context: .
      dockerfile: Dockerfile
      target: web-app
    ports:
      - "4200:80" 
    networks:
      - db_network

volumes:
  mysql_data:

networks:
  db_network:
